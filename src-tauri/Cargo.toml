[package]
name = "codex-autoresume"
version = "0.1.0"
description = "A local Codex continuation companion"
authors = ["Codex AutoResume contributors"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "codex_autoresume"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
which = "8"
url = "2"

[dev-dependencies]
tempfile = "3"
