name: Validate desktop alpha

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend types
        run: npm run check

      - name: Test frontend behavior
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test scheduler and persistence
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check Rust diagnostics
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Compile desktop application without publishing
        run: npm run tauri -- build --no-bundle
